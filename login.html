<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MediCore | Login (OTP UI)</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />

  <!-- Custom CSS -->
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark mc-navbar">
    <div class="container">
      <a class="navbar-brand" href="doctors.html">MediCore</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mcNav" aria-controls="mcNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mcNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="doctors.html">Doctors</a></li>
          <li class="nav-item"><a class="nav-link" href="register.html">Register</a></li>
          <li class="nav-item"><a class="nav-link active" href="login.html">Login</a></li>
          <li class="nav-item"><a class="nav-link" href="token.html">Token</a></li>
          <li class="nav-item"><a class="nav-link" href="queue.html">Queue</a></li>
          <li class="nav-item"><a class="nav-link" href="feedback.html">Feedback</a></li>
          <li class="nav-item"><a class="nav-link" href="admin-dashboard.html">Admin</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Login Card -->
  <main class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-5">
        <div class="mc-card p-4 p-md-5">
          <div class="mc-badge mb-3">Username / Password Login</div>
          <h2 class="fw-bold mb-2">Login</h2>
          <p class="mc-muted mb-4">
            Login with username and password created during registration.
          </p>

          <div id="loginAlert" class="mb-3" role="status" aria-live="polite"></div>

          <div class="mb-3">
            <label class="form-label" for="loginUsername">Username</label>
            <input class="form-control" id="loginUsername" type="text" placeholder="Enter username" />
            <div class="invalid-feedback">Please enter your username.</div>
          </div>

          <div class="mb-3">
            <label class="form-label" for="loginPassword">Password</label>
            <input class="form-control" id="loginPassword" type="password" placeholder="Enter password" />
            <div class="invalid-feedback">Please enter your password.</div>
          </div>

          <div class="d-grid mb-3">
            <button id="loginBtn" class="btn btn-mc-primary text-white" type="button">Login</button>
          </div>

          <hr class="my-4" />

          <div class="small mc-muted">
            New here? <a href="register.html">Register</a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- App JS -->
  <script src="assets/js/app.js"></script>
</body>
</html>
