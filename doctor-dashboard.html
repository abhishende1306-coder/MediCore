<!--
  doctor-dashboard.html - Doctor Dashboard Page
  - Shows today's appointments (from queue) for the logged-in doctor
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MediCore | Doctor Dashboard</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark mc-navbar">
    <div class="container">
      <a class="navbar-brand" href="doctors.html">MediCore</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mcNav" aria-controls="mcNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mcNav">
        <ul class="navbar-nav ms-auto align-items-lg-center">
          <li class="nav-item"><a class="nav-link" href="doctors.html">Doctors</a></li>
          <li class="nav-item"><a class="nav-link" href="queue.html">Queue</a></li>
          <li class="nav-item"><a class="nav-link active" href="doctor-dashboard.html">Doctor Dashboard</a></li>
          <li class="nav-item ms-lg-2">
            <button id="doctorLogoutBtn" class="btn btn-outline-light btn-sm" type="button">Logout</button>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <div class="mc-card p-4">
      <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
        <div>
          <div class="mc-badge mb-2">Doctor Portal</div>
          <h2 class="mc-section-title mb-1">Welcome, <span id="doctorName">Doctor</span></h2>
          <div class="mc-muted">Today’s appointments are derived from today’s queue entries.</div>
        </div>
        <div class="d-flex gap-2">
          <button id="doctorRefreshBtn" type="button" class="btn btn-soft">Refresh</button>
          <a class="btn btn-mc-primary text-white" href="admin-dashboard.html">Admin</a>
        </div>
      </div>

      <hr class="my-4" />

      <div id="doctorDashboardAlert" class="mb-3"></div>
      <div id="doctorStats" class="mb-3"></div>

      <div class="table-responsive">
        <table class="table table-borderless align-middle mb-0">
          <thead>
            <tr>
              <th scope="col">Token</th>
              <th scope="col">Patient</th>
              <th scope="col">Joined</th>
              <th scope="col">Status</th>
              <th scope="col">Type</th>
            </tr>
          </thead>
          <tbody id="doctorAppointmentsTable">
            <tr><td colspan="5" class="text-center mc-muted py-4">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
