<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MediCore | Feedback</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark mc-navbar">
    <div class="container">
      <a class="navbar-brand" href="doctors.html">MediCore</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mcNav" aria-controls="mcNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mcNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="doctors.html">Doctors</a></li>
          <li class="nav-item"><a class="nav-link" href="register.html">Register</a></li>
          <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
          <li class="nav-item"><a class="nav-link" href="token.html">Token</a></li>
          <li class="nav-item"><a class="nav-link" href="queue.html">Queue</a></li>
          <li class="nav-item"><a class="nav-link active" href="feedback.html">Feedback</a></li>
          <li class="nav-item"><a class="nav-link" href="admin-dashboard.html">Admin</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-9 col-lg-7">
        <div class="mc-card p-4 p-md-5">
          <div class="mc-badge mb-3">User Feedback</div>
          <h2 class="fw-bold mb-2">Tell us what you think</h2>
          <p class="mc-muted mb-4">Share suggestions, issues, or improvements.</p>

          <div id="feedbackAlert" class="mb-3" role="status" aria-live="polite"></div>

          <form id="mcFeedbackForm" novalidate>
            <div class="mb-3">
              <label class="form-label" for="fbName">Name (optional)</label>
              <input id="fbName" class="form-control" type="text" placeholder="Your name" maxlength="60" />
            </div>

            <div class="mb-3">
              <label class="form-label" for="fbPhone">Phone (optional)</label>
              <input id="fbPhone" class="form-control" type="tel" inputmode="numeric" placeholder="10-digit phone" maxlength="10" />
              <div class="form-text mc-muted">If provided, we can contact you about your feedback.</div>
            </div>

            <div class="mb-3">
              <label class="form-label" for="fbRating">Rating</label>
              <select id="fbRating" class="form-select" required>
                <option value="">Select</option>
                <option value="5">5 - Excellent</option>
                <option value="4">4 - Good</option>
                <option value="3">3 - Okay</option>
                <option value="2">2 - Bad</option>
                <option value="1">1 - Very Bad</option>
              </select>
              <div class="invalid-feedback">Please choose a rating.</div>
            </div>

            <div class="mb-4">
              <label class="form-label" for="fbMessage">Feedback</label>
              <textarea id="fbMessage" class="form-control" rows="4" placeholder="Write your feedback..." required maxlength="800"></textarea>
              <div class="invalid-feedback">Please enter your feedback.</div>
              <div class="form-text mc-muted"><span id="fbCharsLeft">800</span> characters left</div>
            </div>

            <div class="d-grid">
              <button id="fbSubmitBtn" class="btn btn-mc-primary text-white" type="submit">Submit Feedback</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
