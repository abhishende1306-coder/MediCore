<!--
  doctor-login.html - Doctor Login Page
  - Login for doctor portal to view today's appointments
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MediCore | Doctor Login</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark mc-navbar">
    <div class="container">
      <a class="navbar-brand" href="doctors.html">MediCore</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mcNav" aria-controls="mcNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mcNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="doctors.html">Doctors</a></li>
          <li class="nav-item"><a class="nav-link" href="register.html">Register</a></li>
          <li class="nav-item"><a class="nav-link" href="login.html">Patient Login</a></li>
          <li class="nav-item"><a class="nav-link" href="token.html">Token</a></li>
          <li class="nav-item"><a class="nav-link" href="queue.html">Queue</a></li>
          <li class="nav-item"><a class="nav-link active" href="doctor-login.html">Doctor</a></li>
          <li class="nav-item"><a class="nav-link" href="admin-dashboard.html">Admin</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-6">
        <div class="mc-card p-4">
          <div class="mc-badge mb-2">Doctor Portal</div>
          <h2 class="mc-section-title mb-1">Doctor Login</h2>
          <div class="mc-muted mb-4">Login to view today’s appointments.</div>

          <div id="doctorLoginAlert" class="mb-3"></div>

          <form id="mcDoctorLoginForm" novalidate>
            <div class="mb-3">
              <label class="form-label" for="doctorUsername">Username</label>
              <input id="doctorUsername" class="form-control" type="text" placeholder="e.g. dr-rajesh-sharma" autocomplete="username" required />
            </div>

            <div class="mb-3">
              <label class="form-label" for="doctorPassword">Password</label>
              <input id="doctorPassword" class="form-control" type="password" placeholder="doctor password" autocomplete="current-password" required />
              <div class="form-text">Default password: <code>doctor123</code></div>
            </div>

            <button id="doctorLoginBtn" type="submit" class="btn btn-mc-primary text-white w-100">Login</button>
          </form>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
