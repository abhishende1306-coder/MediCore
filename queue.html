<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MediCore | Patient Queue</title>

  <!-- Bootstrap 5 CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />

  <!-- Custom CSS -->
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark mc-navbar">
    <div class="container">
      <a class="navbar-brand" href="doctors.html">MediCore</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mcNav" aria-controls="mcNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mcNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="doctors.html">Doctors</a></li>
          <li class="nav-item"><a class="nav-link" href="register.html">Register</a></li>
          <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
          <li class="nav-item"><a class="nav-link" href="token.html">Token</a></li>
          <li class="nav-item"><a class="nav-link active" href="queue.html">Queue</a></li>
          <li class="nav-item"><a class="nav-link" href="feedback.html">Feedback</a></li>
          <li class="nav-item"><a class="nav-link" href="admin-dashboard.html">Admin</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Page Header -->
  <header class="container my-5">
    <div class="mc-card p-4">
      <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
        <div>
          <div class="mc-badge mb-2">Patient Queue</div>
          <h2 class="mc-section-title mb-1">Waiting Patients</h2>
          <div class="mc-muted">View current patient queue and wait times.</div>
        </div>
        <div class="d-flex gap-2">
          <button id="refreshQueueBtn" class="btn btn-soft">Refresh</button>
          <a class="btn btn-mc-primary text-white" href="doctors.html">View Doctors</a>
        </div>
      </div>
    </div>
  </header>

  <!-- Queue Stats -->
  <section class="container mb-5">
    <div class="row g-4" id="queueStats">
      <!-- Stats will be populated by JavaScript -->
    </div>
  </section>

  <!-- Queue List -->
  <main class="container pb-5">
    <div class="mc-card p-4">
      <h3 class="mb-4">Current Queue</h3>
      <div id="queueAlert" class="mb-3" role="status" aria-live="polite"></div>
      <div class="table-responsive mb-3" id="queueList">
        <!-- Queue items will be populated by JavaScript -->
      </div>
    </div>
  </main>

  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- App JS -->
  <script src="assets/js/app.js"></script>
</body>
</html>
